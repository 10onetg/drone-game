/* ---------- BGM ----------
   場面ごとの曲。ファイル名（またはURL）を入れると流れる。空の場面は無音。
   ブラウザの決まりで、最初にどこかをタップするまでは音が出ない */
const BGM = { title: 'bgm/bgm-title.mp3', town: 'bgm/bgm-town.mp3', room: 'bgm/bgm-room.mp3', battle: 'bgm/bgm-battle.mp3', fly: 'bgm/bgm-fly.mp3', side: 'bgm/bgm-side.mp3', ending: 'bgm/bgm-ending.mp3' };
const BGM_VOLUME = 0.5;
const audio = { el: null, cur: '', unlocked: false };
function bgmScene() {
  if (F.active) return 'fly';
  if (['title', 'notice'].includes(S.screen)) return 'title';
  if (S.screen === 'ending') return 'ending';
  if (S.screen === 'map') return 'town';
  if (S.inCh != null && CH[S.inCh]?.side) return 'side';
  if (S.screen === 'play' && typeof inBattle === 'function' && inBattle()) return 'battle';
  if (['room', 'play', 'practice', 'parts', 'lighthouse'].includes(S.screen)) return 'room';
  return audio.cur ? audio.scene : 'town'; // 持ち物などの画面では、そのまま流し続ける
}
function updateBgm() {
  const sc = bgmScene(), src = S.sound === false ? '' : (BGM[sc] || (['battle', 'side'].includes(sc) ? BGM.room : '') || ''); // バトルとサブは、曲がなければ建物の中の曲
  audio.scene = sc;
  if (src === audio.cur) return;
  audio.cur = src;
  if (!audio.el) { audio.el = new Audio(); audio.el.loop = true; audio.el.volume = BGM_VOLUME; }
  if (!src) { audio.el.pause(); return; }
  audio.el.src = src;
  if (audio.unlocked) audio.el.play().catch(() => {});
}
window.addEventListener('pointerdown', () => { if (!audio.unlocked) { audio.unlocked = true; if (audio.cur) audio.el?.play().catch(() => {}); } }, { capture: true });

    { label: 'おすすめのリモートID搭載ドローン 2', name: '', point: '', url: 'https://link.amazon/B0ahM0VQm' }] },

    { label: 'ランディングパッド（65cm）', name: '', point: '', url: 'https://link.amazon/B0dw0CdC2' }] },
};
function affCard(key, small) {
  const a = AFFILIATE[key]; if (!a) return null;
  const links = a.links || (a.url ? [{ label: a.title + ' を見る', url: a.url }] : []);
  if (!links.length && !AFF_SHOW_EMPTY) return null;
  const body = links.length && a.links && !small ? affCards(links)
    : links.length ? el('div', { class: 'afflinks' }, ...links.map((l) => el('a', { href: l.url, target: '_blank', rel: 'sponsored noopener' }, (l.name || l.label) + '（Amazon）')))
    : el('span', {}, a.title + '（リンク準備中）');
  return el('div', { class: 'aff' + (small ? ' small' : '') }, el('span', { class: 'adtag' }, '広告・PR'),
    small ? null : el('span', {}, links.length && a.links ? a.title + '：' : '実際に買うなら：'), body);
}

function affCards(links) {
  return el('div', { class: 'affcards' }, ...links.map((l) => el('a', { class: 'affcard', href: l.url, target: '_blank', rel: 'sponsored noopener' },
    el('span', { class: 'affinfo' }, el('b', {}, l.name || l.label), l.point ? el('small', {}, l.point) : null, el('span', { class: 'affbtn' }, 'Amazonで見る ▶')))));
}

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
const yen = (n) => n.toLocaleString('ja-JP') + '円';

  if (KEYMAP[e.key]) { e.preventDefault(); M.held = KEYMAP[e.key]; }
  if (isWalk() && (e.key === 'Enter' || e.key === ' ' || e.key === 'z')) { e.preventDefault(); interact(); }
});
window.addEventListener('keyup', (e) => { F.keys?.delete(e.key); if (KEYMAP[e.key] === M.held) M.held = null; });

const DELTA = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function npcAt(x, y) { return M.map.npcs.find((n) => n.x === x && n.y === y); }
function blocked(x, y) { return x < 0 || y < 0 || x >= M.map.w || y >= M.map.h || SOLID.has(M.map.g[y][x]) || !!npcAt(x, y); }

function tick(now) {
  const cv = M.canvas;
  if (!isWalk() || !cv?.isConnected) return;
  M.t = now;
  const P = pos();
  if (M.moving) {
    const k = Math.min(1, (now - M.moving.start) / 140);
    M.moving.k = k;
    if (k >= 1) { P.x = M.moving.tx; P.y = M.moving.ty; M.moving = null; save(); arrive(); }
  }
  if (!M.moving && M.held && !M.msg) {
    P.dir = M.held;
    const [dx, dy] = DELTA[M.held], tx = P.x + dx, ty = P.y + dy;
    const tile = M.map.g[ty]?.[tx];
    if (!M.map.room && (tile === 'd' || tile === 'e')) enterDoor(tx, ty);
    else if (M.map.room && tile === 'x') leaveRoom();
    else if (!blocked(tx, ty)) M.moving = { tx, ty, start: now, k: 0 };
  }
  if (isWalk() && M.canvas === cv) { draw(); M.loop = requestAnimationFrame(tick); }
}

function arrive() {
  if (M.map.room) return;
  const t = TOWN[S.pos.y][S.pos.x];
  if (t === 's' && S.pos.y >= 31 && !M.seaTold) { M.seaTold = true; say([['', '潮のにおいがする。砂浜だ。']]); }
}

function enterDoor(x, y) {
  M.held = null;
  if (TOWN[y][x] === 'e') { tryChapter(pickCh(GATE_CHS), '郊外の草原'); return; }
  const key = DOORS[x + ',' + y], name = BUILDINGS.find((b) => b.key === key).name;
  if (key === 'parts') { S.screen = 'parts'; save(); render(); return; }
  if (key === 'lighthouse') {
    if (S.signs.length < Object.keys(SIGNS).length) { say([['', `灯台の扉に、はり紙がある。「町の看板を全部読んだ人だけ、お入りください。」（看板図鑑 ${S.signs.length} / ${Object.keys(SIGNS).length}）`]]); return; }
    setScreen('lighthouse'); return;
  }
  const ch = pickCh(BLD_CHS[key]);
  if (key === 'school' && S.cleared >= 3 && (S.inCh == null || S.needPractice) && ch !== targetCh()) { // 練習場はいつでも使える
    const opts = [['練習場で練習する', () => setScreen('practice')]];
    if (ch <= S.cleared && S.inCh == null) opts.push(['章をもう一度', () => startChapter(ch, key)]);
    opts.push(['やめる', null]);
    say([['', 'ドローンスクール。屋内練習場で練習していこうかな。']], opts); return;
  }
  tryChapter(ch, name, key);
}
function leaveRoom() { M.held = null; S.screen = 'map'; save(); render(); }

function tryChapter(ch, name, sub) {
  if (S.inCh === ch) { if (sub) S.sub = sub; S.rpos = { x: 5, y: 7, dir: 'up' }; S.screen = (stepsOf(ch)[S.step]?.seg || !roomDef(ch).npcs.some((n) => n.id === segOf(S.step))) ? 'room' : 'play'; save(); render(); return; }
  if (ch > S.cleared + 1) { say([['', `${name}。……今はまだ用事がなさそうだ。`]]); return; }
  if (ch <= S.cleared) {
    say([['', `${name}。もう一度ここでの出来事を体験する？`]], [['はい', () => startChapter(ch, sub)], ['いいえ', null]]);
    return;
  }
  startChapter(ch, sub);
}

const NPC_TALK = {
  norio: () => S.cleared >= CH.length - 1 ? 'おれも登録を確認してきたぜ！' : S.cleared >= 2 ? '公園で飛ばせないなんて知らなかったよ……。' : 'ドローン？　ルールなんて、だいたいでいいんだって！',
  granny: () => S.cleared < 2 ? 'あそこの公園の看板、読んでごらん。大事なことが書いてあるよ。' : S.signs.length < Object.keys(SIGNS).length ? `この町には、ドローンに関係する看板があちこちにあるよ。あと${Object.keys(SIGNS).length - S.signs.length}枚、見つけられるかい？` : '看板を全部読んだのかい。たいしたもんだねえ。',
};

// 物語データの区切り { seg: id } — 部屋の中で、その人に話しかけると続きが始まる
function curSeg() { const s = stepsOf(S.ch)[S.step]; return s && s.seg; }
function segOf(i) { const st = stepsOf(S.ch); for (let j = Math.min(i, st.length - 1); j >= 0; j--) if (st[j].seg) return st[j].seg; return null; }
function segDone(id) { return CH[S.ch].free ? (S.segsDone || []).includes(id) : stepsOf(S.ch).slice(0, S.step).some((s) => s.seg === id); }
// free: true の章は、部屋の人に好きな順で話しかけられる。全員と話すと { seg: '_end' } のあとが流れる
function freeSegs() { return stepsOf(S.ch).filter((s) => s.seg && s.seg !== '_end').map((s) => s.seg); }
function talkRoom(n) {
  if (CH[S.ch].free && freeSegs().includes(n.id) && !segDone(n.id)) {
    S.step = stepsOf(S.ch).findIndex((s) => s.seg === n.id) + 1; S.screen = 'play'; save(); render(); return;
  }
  if (!CH[S.ch].free && curSeg() === n.id) { S.step++; S.screen = 'play'; save(); render(); return; }
  say([[n.name, segDone(n.id) ? (n.after || 'また何かあったら聞いてね。') : (n.before || 'あとで話そう。')]]);
}

function interact() {
  if (M.msg) { nextMsg(); return; }
  const P = pos(), [dx, dy] = DELTA[P.dir], fx = P.x + dx, fy = P.y + dy;
  const n = npcAt(fx, fy), tile = M.map.g[fy]?.[fx];
  if (M.map.room) {
    if (n) talkRoom(n);
    else if (tile === 'S') say([['', 'ドローンや本が、ぎっしり並んでいる。']]);
    else if (tile === 'c') say([['', M.map.name === '自宅' ? 'いつも使っている机だ。' : 'カウンターだ。人に話しかけてみよう。']]);
    else if (tile === 'w') say([['', '水面がきらきら光っている。']]);
    return;
  }
  if (n) {
    if (n.ch != null && (n.ch === targetCh() || n.ch <= S.cleared || S.inCh === n.ch)) { tryChapter(n.ch, n.name); return; }
    if (n.id === 'senpai') { say([[n.name, `次は${PLACES[targetCh()].name}に行ってみよう。悩みノートも見返してね。`]]); return; }
    if (n.id === 'beach') { say([[n.name, 'ここで飛ばしたいなら、まずは空撮デビューを済ませておいで。']]); return; }
    if (n.id === 'board') { setScreen('quests'); return; }
    const sq = sideReady(n.id);
    if (sq && n.id === 'norio') { startChapter(sq); return; }
    if (sq) { say([[n.name, `（${SIDE[sq].title.replace('サブ：', '')}）　ちょっとお願いがあるんだけど、聞いてもらえる？`]], [['聞く', () => startChapter(sq)], ['あとで', null]]); return; }
    if (SIDE_NPCS[n.id] && !NPC_TALK[n.id]) {
      const nx = sideNext(n.id);
      say([[n.name, nx ? (S.inCh != null ? '今は用事があるみたいだね。終わったら、また来ておくれ。' : `また今度お願いしたいことがあるんだ。（${SIDE[nx].condText}）`) : 'この前は、本当にありがとう！']]); return;
    }
    say([[n.name, NPC_TALK[n.id]()]]); return;
  }
  const hk = fx + ',' + fy, hid = !M.map.room && HIDDEN[hk];
  if (hid && !S.found.includes(hk) && !(hid.quest && S.sideDone.includes(hid.quest))) {
    if (hid.quest) {
      if (!SIDE[hid.quest].cond()) { say([['', '草むらの中で、何かが光った気がする……。（' + SIDE[hid.quest].condText + 'にまた来よう）']]); return; }
      if (S.inCh != null) { say([['', '草むらの中に何かある。今の用事が終わったら、また調べに来よう。']]); return; }
      startChapter(hid.quest); return;
    }
    S.found.push(hk);
    if (hid.money) S.money += hid.money;
    if (hid.item) addItem(hid.item);
    save(); renderStatus(); say([['', hid.text]]); checkTreasure(); return;
  }
  if (tile === 'k' && SIGNS[fx + ',' + fy] !== 'park') { say([['看板', SIGNS[fx + ',' + fy] || '看板だ。']]); if (SIGNS[fx + ',' + fy]) readSign(fx + ',' + fy); return; }
  if (tile === 'H') { say([['', '家がぎっしり並んでいる。このあたりは人口集中地区（DID）だ。']]); return; }
  if (tile === 'R') { say([['', '線路だ。電車が通る。']]); return; }
  if (tile === 'a' || tile === 'A') { say([['', '空港の敷地だ。柵の中には入れない。']]); return; }
  if (tile === 'T') { say([['', '大きな鉄塔。高圧線がのびている。']]); return; }
  if (tile === 'h') { const b = M.map.buildings.find((q) => fx >= q.x && fx < q.x + q.w && fy >= q.y && fy < q.y + q.h); if (b && !b.key) { say([['', `${b.name}だ。`]]); return; } }
  if (tile === 'k') {
    S.signRead = true; save(); readSign(fx + ',' + fy);
    const lines = [['看板', '〇〇市立公園　ドローン・ラジコンの飛行は禁止です（市の条例・公園管理事務所）']];
    if (S.inCh != null && stepsOf(S.inCh)[S.step]?.needSign) lines.push(['', '飛行禁止だ！　家に戻って、ノリオに伝えよう。']);
    say(lines); return;
  }
  if (tile === 'w') { say([['', '川の流れがきらきら光っている。']]); return; }
}

function say(lines, choices) { M.msg = { lines, i: 0, choices }; M.held = null; renderMsg(); }
function nextMsg() {
  if (!M.msg) return;

}

  box.innerHTML = '';
  const [who, text] = M.msg.lines[M.msg.i];
  const m = msgBox(who, text, null);
  box.append(m);
  if (M.msg.choices && M.msg.i === M.msg.lines.length - 1) {
    m.querySelector('.next').remove();
    const row = el('div', { class: 'choices', style: 'flex-direction:row;margin-top:8px' });
    for (const [label, fn] of M.msg.choices) row.append(el('button', { type: 'button', onclick: () => { M.msg = null; showHint(); if (fn) fn(); } }, label));
    m.append(row);
  }
}
function showHint() {
  const box = $('townmsg'); if (!box) return;
  box.innerHTML = '';
  if (!M.map.room && S.needPractice && !S.items.includes(PRACTICE_REC)) { box.append(el('p', { class: 'small hint' }, '目的：ドローンスクールの屋内練習場で、3つの練習に合格する')); return; }
  if (!M.map.room && S.needPractice) { box.append(el('p', { class: 'small hint' }, '練習に合格した！　目的：自宅のパソコンで申請の続き')); return; }
  if (M.map.room) {

    box.append(el('p', { class: 'small hint' }, (CH[S.ch].free ? `自宅のパソコン・家電店の保険コーナー・ドローンスクールを、好きな順に回ろう（のこり ${left}）。` : '人の前でAボタンを押すと話せます。') + '下の赤いマットから町に戻れます。'));

}

function draw() {
  const c = M.ctx, ts = M.ts, VW = 11, VH = 9, G = M.map.g, P = pos();
  let px = P.x, py = P.y;
  if (M.moving) { px += (M.moving.tx - P.x) * M.moving.k; py += (M.moving.ty - P.y) * M.moving.k; }
  const camX = Math.max(0, Math.min(M.map.w - VW, px - (VW - 1) / 2)), camY = Math.max(0, Math.min(M.map.h - VH, py - (VH - 1) / 2));
  c.fillStyle = '#10192e'; c.fillRect(0, 0, ts * VW, ts * VH);
  const x0 = Math.floor(camX), y0 = Math.floor(camY);
  for (let y = y0; y <= y0 + VH && y < M.map.h; y++) for (let x = x0; x <= x0 + VW && x < M.map.w; x++) {
    const t = G[y][x], sx = (x - camX) * ts, sy = (y - camY) * ts;
    c.fillStyle = TILE_COLOR[t]; c.fillRect(sx, sy, ts + 1, ts + 1);
    if (t === 'w') { const o = ((M.t / 400 + x + y) % 2) < 1 ? 0.2 : 0.55; c.fillStyle = '#9fd0f0'; c.fillRect(sx + ts * o, sy + ts * 0.45, ts * 0.25, 2); }
    if (t === 't') { c.fillStyle = '#3f7a46'; c.beginPath(); c.arc(sx + ts / 2, sy + ts * 0.42, ts * 0.38, 0, 7); c.fill(); c.fillStyle = '#5b3d22'; c.fillRect(sx + ts * 0.44, sy + ts * 0.7, ts * 0.12, ts * 0.25); }
    if (t === 'f') { c.fillStyle = '#c9a571'; c.fillRect(sx, sy + ts * 0.35, ts, 3); c.fillRect(sx, sy + ts * 0.65, ts, 3); }
    if (t === 'p' && (x * 7 + y * 3) % 5 === 0) { c.fillStyle = '#f2e27a'; c.fillRect(sx + ts * 0.3, sy + ts * 0.3, 3, 3); }
    if (t === 'b') { c.fillStyle = '#7a5c3a'; for (let i = 1; i < 4; i++) c.fillRect(sx + (ts / 4) * i, sy, 2, ts); }
    if (t === 'k') { c.fillStyle = '#8a6a43'; c.fillRect(sx + ts * 0.45, sy + ts * 0.5, ts * 0.1, ts * 0.45); c.fillStyle = '#efe6d2'; c.fillRect(sx + ts * 0.15, sy + ts * 0.15, ts * 0.7, ts * 0.42); c.fillStyle = '#c0392b'; c.fillRect(sx + ts * 0.25, sy + ts * 0.32, ts * 0.5, 3); }
    if (t === 'F') { c.fillStyle = '#b8966b'; c.fillRect(sx, sy + ts * 0.5, ts, 1); }
    if (t === 'S') { for (const [bx, col] of [[0.12, '#e06a5a'], [0.42, '#7fb0ff'], [0.7, '#f2e27a']]) { c.fillStyle = col; c.fillRect(sx + ts * bx, sy + ts * 0.25, ts * 0.2, ts * 0.3); } }
    if (t === 'c') { c.fillStyle = '#a8764a'; c.fillRect(sx, sy + ts * 0.15, ts, ts * 0.15); }
    if (t === 'x') { c.fillStyle = '#d06a5a'; c.fillRect(sx + ts * 0.15, sy + ts * 0.2, ts * 0.7, ts * 0.6); }
    if (t === 'H') { // 住宅：屋根の色を少しずつ変える
      c.fillStyle = '#e8e2d4'; c.fillRect(sx + ts * 0.12, sy + ts * 0.45, ts * 0.76, ts * 0.5);
      c.fillStyle = ['#a84a3a', '#3a5a8a', '#6a6a6a', '#8a5a2a'][(x * 3 + y * 5) % 4];
      c.beginPath(); c.moveTo(sx + ts * 0.04, sy + ts * 0.5); c.lineTo(sx + ts / 2, sy + ts * 0.1); c.lineTo(sx + ts * 0.96, sy + ts * 0.5); c.fill();
    }
    if (t === 'a') { c.fillStyle = '#eee'; if (y % 2 === 0 && x % 2 === 0) c.fillRect(sx + ts * 0.2, sy + ts - 2, ts * 0.6, 3); }
    if (t === 'R') { c.fillStyle = '#5a4a3a'; for (let i = 0; i < 3; i++) c.fillRect(sx + ts * (0.1 + i * 0.33), sy + ts * 0.2, ts * 0.12, ts * 0.6); c.fillStyle = '#c0c0c0'; c.fillRect(sx, sy + ts * 0.3, ts, 2); c.fillRect(sx, sy + ts * 0.66, ts, 2); }
    if (t === 'X') { c.fillStyle = '#c0c0c0'; c.fillRect(sx, sy + ts * 0.3, ts, 2); c.fillRect(sx, sy + ts * 0.66, ts, 2); c.fillStyle = '#f2d24a'; c.fillRect(sx, sy, ts * 0.1, ts); c.fillRect(sx + ts * 0.9, sy, ts * 0.1, ts); }
    if (t === 'T') { c.strokeStyle = '#c8c8c8'; c.lineWidth = 2; c.beginPath(); c.moveTo(sx + ts * 0.2, sy + ts); c.lineTo(sx + ts / 2, sy); c.lineTo(sx + ts * 0.8, sy + ts); c.moveTo(sx + ts * 0.15, sy + ts * 0.3); c.lineTo(sx + ts * 0.85, sy + ts * 0.3); c.stroke(); }
  }
  if (!M.map.room) { // 高圧線
    c.strokeStyle = 'rgba(30,30,30,.7)'; c.lineWidth = 1;
    for (let i = 0; i + 1 < TOWERS.length; i++) for (const o of [0.2, 0.8]) {
      const [ax, ay] = TOWERS[i], [bx, by] = TOWERS[i + 1];
      c.beginPath(); c.moveTo((ax + o - camX) * ts, (ay + 0.3 - camY) * ts); c.lineTo((bx + o - camX) * ts, (by + 0.3 - camY) * ts); c.stroke();
    }
  }
  for (const b of M.map.buildings) {
    const sx = (b.x - camX) * ts, sy = (b.y - camY) * ts;
    c.fillStyle = '#e8e2d4'; c.fillRect(sx, sy + ts * 0.9, b.w * ts, b.h * ts - ts * 0.9);
    c.fillStyle = b.color; c.fillRect(sx - 2, sy, b.w * ts + 4, ts * 1.1);
    c.fillStyle = '#1b2440';
    for (let i = 0; i < b.w; i++) if (i !== Math.floor(b.w / 2)) c.fillRect(sx + i * ts + ts * 0.3, sy + ts * 1.5, ts * 0.4, ts * 0.4);
    if (b.cross) { c.fillStyle = '#d03030'; c.fillRect(sx + b.w * ts / 2 - ts * 0.1, sy + ts * 1.3, ts * 0.2, ts * 0.7); c.fillRect(sx + b.w * ts / 2 - ts * 0.35, sy + ts * 1.55, ts * 0.7, ts * 0.2); }
    c.fillStyle = b.cross ? '#1b2440' : '#fff'; c.font = `${Math.round(ts * 0.42)}px DotGothic16, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(b.name, sx + (b.w * ts) / 2, sy + ts * 0.55);
  }
  for (const [k] of Object.entries(M.map.doors)) { const [x, y] = k.split(',').map(Number); const sx = (x - camX) * ts, sy = (y - camY) * ts; c.fillStyle = '#3a2a1c'; c.fillRect(sx + ts * 0.2, sy, ts * 0.6, ts); }
  // 係の看板（カウンターの上）
  for (const n of M.map.npcs) if (n.sign) {
    const sx = (n.x - camX) * ts, sy = (n.y - 1 - camY) * ts;
    c.fillStyle = '#efe6d2'; c.fillRect(sx + ts * 0.06, sy + ts * 0.18, ts * 0.88, ts * 0.6);
    c.fillStyle = '#1b2440'; c.font = `${Math.round(ts * 0.36)}px DotGothic16, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(n.sign, sx + ts / 2, sy + ts * 0.5);
  }
  if (!M.map.room) for (const [k, h] of Object.entries(HIDDEN)) { // かくしアイテムが、ときどききらっと光る（宝の地図があると、いつも光る）
    if (S.found.includes(k) || (h.quest && S.sideDone.includes(h.quest))) continue;
    const [hx, hy] = k.split(',').map(Number), ph = (M.t / 160 + hx * 3 + hy) % 24;
    if (!S.treasureMap && ph > 2) continue;
    const sx = (hx - camX) * ts + ts / 2, sy = (hy - camY) * ts + ts / 2, r = ts * (S.treasureMap ? 0.28 : 0.22);
    c.fillStyle = S.treasureMap ? '#ffd54a' : '#ffffff'; c.beginPath();
    c.moveTo(sx, sy - r); c.lineTo(sx + r * 0.25, sy - r * 0.25); c.lineTo(sx + r, sy); c.lineTo(sx + r * 0.25, sy + r * 0.25); c.lineTo(sx, sy + r); c.lineTo(sx - r * 0.25, sy + r * 0.25); c.lineTo(sx - r, sy); c.lineTo(sx - r * 0.25, sy - r * 0.25); c.fill();
  }
  for (const n of M.map.npcs) {
    const sx = (n.x - camX) * ts, sy = (n.y - camY) * ts;

      S.pmode = null; S.plog.min += p.min; S.plog.runs++;

function noteCh(id) { return CH.findIndex((c) => c.steps.some((x) => x.note === id)); }
function replayChapter(n) {
  const r = ROOMS[n], first = CH[n].steps.find((x) => x.seg)?.seg;
  const sub = r.subs ? Object.keys(r.subs).find((k) => r.subs[k].npcs.some((p) => p.id === first)) : null;
  startChapter(n, sub);
}
function viewChapters() {
  const box = el('div', { class: 'choices' });
  CH.forEach((c, n) => {
    const ok = n <= S.cleared && S.inCh == null;
    box.append(el('button', { type: 'button', ...(ok ? {} : { disabled: '' }), onclick: () => replayChapter(n) },
      `${c.title}　―　${PLACES[n].sub}` + (n > S.cleared ? '（まだクリアしていません）' : '')));
  });
  scene.append(el('h2', {}, '章をえらんで、もう一度確認する'),

function reportContext() {
  const ch = S._return === 'play' || S._return === 'room' ? S.ch : S.inCh;
  const st = ch != null ? stepsOf(ch)[S.step] : null;
  const text = st ? (st.say ? st.say.join('：') : st.quiz?.q || st.multi?.q || st.choice?.q || st.order?.q || st.fly?.q || '') : '';
  return [`場所：${ch != null ? CH[ch].title : '町'}（${ch != null ? 'ステップ' + S.step : '-'}）`, text ? `画面の文：${text}` : '',

}

    el('button', { type: 'button', onclick: () => { S._return = 'ending'; setScreen('report'); } }, '不具合・まちがいを報告する'));
}

/* ---------- 章の進行 ---------- */
function startChapter(n, sub) {
  S.sub = sub || null; S.ch = n; S.step = 0; S.inCh = n; S.segsDone = []; S.rpos = { x: 5, y: 7, dir: 'up' };
  S.screen = CH[n].steps[0].seg ? 'room' : 'play';
  S.checkpoint = { trust: S.trust, money: S.money, notes: [...S.notes], items: [...S.items] }; S.miss = 0; S.wrongAt = null;
  save(); render();
}
function stepsOf(n) { return CH[n].steps; }
function advance() {
  S.step++;
  const steps = stepsOf(S.ch);
  if (CH[S.ch].free && (S.step >= steps.length || steps[S.step].seg)) {
    const id = segOf(S.step - 1);
    if (id === '_end') { finishChapter(); return; }
    S.segsDone = [...new Set([...(S.segsDone || []), id])];
    if (freeSegs().every((x) => S.segsDone.includes(x))) S.step = steps.findIndex((x) => x.seg === '_end') + 1;
    else S.screen = 'room';
    save(); render(); return;
  }
  if (S.step >= steps.length) { finishChapter(); return; }
  save(); render();
}
function finishChapter() {
  if (CH[S.ch].side) {
    S.inCh = null; S.lastSide = S.ch;
    if (!S.sideDone.includes(S.ch)) S.sideDone.push(S.ch);
    if (SIDE_NPCS.norio.every((id) => S.sideDone.includes(id))) award('norio');
    if (SIDE_ORDER.every((id) => S.sideDone.includes(id))) award('side');
    checkTreasure();
    setScreen('sideclear'); return;
  }
  const first = S.ch > S.cleared;
  S.inCh = null;
  if (first) { S.cleared = S.ch; S.rank = Math.min(CH.length, S.rank + 1); S.money += 10000; }
  if (!S.miss && stepsOf(S.ch).filter(isQ).length >= 2) { if (S.ch === 7) award('rules'); award('nomiss'); }
  if (S.ch === CH.length - 1) { setScreen('ending'); return; }
  setScreen(first ? 'ad' : 'map');
}
function addNote(id) { if (!S.notes.includes(id)) { S.notes.push(id); if (S.notes.length === Object.keys(WORRIES).length) award('notes'); } }
// 称号：手に入れたら画面の上に知らせを出す
function award(id) { if (!BADGES[id] || S.badges.includes(id)) return; S.badges.push(id); save(); toast(`🏅 称号「${BADGES[id][0]}」を手に入れた！`); }
// その問題を1回目で正解したときだけ称号
function awardFirstTry(id) { if (id && S.wrongAt !== S.ch + '-' + S.step) award(id); }
function toast(text) {
  const t = el('div', { class: 'toast', role: 'status' }, text);
  let box = document.querySelector('.toasts'); if (!box) { box = el('div', { class: 'toasts' }); document.body.append(box); }
  box.append(t); setTimeout(() => t.classList.add('out'), 2600); setTimeout(() => t.remove(), 3200);
}
function addItem(it) { if (!S.items.includes(it)) S.items.push(it); }
function changeTrust(d) {
  if (d < 0) { S.miss = (S.miss || 0) + 1; S.wrongAt = S.ch + '-' + S.step; }
  S.trust = Math.max(0, Math.min(100, S.trust + d));
  renderStatus();
  return S.trust <= 0;
}

function gameOver() {
  document.body.classList.remove('flying');
  scene.innerHTML = '';
  scene.append(el('h2', {}, '信頼度が 0 になった'),
    el('p', {}, 'じゅん先輩「大丈夫、失敗から学べばいい。この章をもう一度やってみよう。」'),
    el('button', { type: 'button', class: 'primary', onclick: () => { Object.assign(S, structuredClone(S.checkpoint)); S.trust = Math.max(S.trust, 50); S.step = 0; S.segsDone = []; save(); render(); } }, 'この章のはじめから'));
}

function header() {
  const h = [el('p', { class: 'place' }, CH[S.ch].place), el('h2', {}, CH[S.ch].title)];
  if (inBattle()) h.push(battlePanel());
  return h;
}
// 第4章：ルールモンスターとのクイズバトル。HPは残りの問題数
const isQ = (s) => s.quiz || s.multi || s.order;
function inBattle() { return CH[S.ch].battle && segOf(S.step) === CH[S.ch].battle; }
function battlePanel() {
  const st = stepsOf(S.ch); let a = S.step; while (a > 0 && !st[a].seg) a--;
  let b = S.step; while (b + 1 < st.length && !st[b + 1].seg) b++;
  const total = st.slice(a, b + 1).filter(isQ).length, left = st.slice(S.step, b + 1).filter(isQ).length;
  return el('div', { class: 'battle' }, el('span', { class: 'mon', 'aria-hidden': 'true' }, '👾'),
    el('div', { style: 'flex:1' }, el('b', {}, 'ルールモンスター　HP ' + left + ' / ' + total),
      el('div', { class: 'bar' }, el('i', { style: `width:${total ? left / total * 100 : 0}%;background:var(--ng)` }))));
}
// 会話の窓。onNext があるときは下にAボタンを置き、Aボタン（またはEnter・スペース・Zキー）で次へ進む
function msgBox(who, text, onNext) {
  const box = el('div', { class: 'msg' },
    who ? el('div', { class: 'who' }, who) : null, el('p', {}, text), el('span', { class: 'next', 'aria-hidden': 'true' }, 'A'));
  if (!onNext) return box;
  const a = el('button', { type: 'button', class: 'abtn msg-a', 'aria-label': 'つぎへ' }, 'A');
  a.addEventListener('click', onNext);
  return el('div', { class: 'msgwrap' }, box, el('div', { class: 'msgpad' }, a));
}
function feedback(ok, text, onNext, label = 'つぎへ') {
  return [el('div', { class: 'fb ' + (ok ? 'ok' : 'ng') }, el('b', {}, ok ? (inBattle() ? '◎ こうげき成功！　モンスターにダメージ！' : '◎ せいかい') : (inBattle() ? '× モンスターの反撃！' : '× ざんねん')), el('p', {}, text)),
    el('button', { type: 'button', class: 'primary', onclick: onNext }, label)];
}

function quitToTown() { S.inCh = null; setScreen('map'); }
function viewPlay() {
  const s = stepsOf(S.ch)[S.step];
  if (!s || s.seg) { S.screen = 'room'; save(); render(); return; }
  scene.append(...header());
  if (s.say) { scene.append(msgBox(s.say[0], s.say[1], advance)); return; }
  const key = S.ch + '-' + S.step, fresh = S.applied !== key;
  if (fresh && (s.get || s.note || s.money)) S.applied = key;
  if (s.get) { addItem(s.get); save(); scene.append(msgBox('', `「${s.get}」を手に入れた！`, advance)); return; }
  if (s.note) { addNote(s.note); save(); renderStatus(); scene.append(msgBox('悩みノート', `「${WORRIES[s.note]}」が解決した！`, advance)); return; }
  if (s.money) { if (fresh) S.money += s.money; save(); renderStatus(); scene.append(msgBox('', `${s.msg}（${s.money > 0 ? '+' + yen(s.money) : yen(-s.money)}）`, advance)); return; }
  if (s.badge) { award(s.badge); advance(); return; }
  if (s.aff) { const card = affCard(s.aff); if (!card) { advance(); return; } scene.append(card, msgBox('', s.text, advance)); return; }
  if (s.has) { const [who, text] = S.items.includes(s.has.item) ? s.has.yes : s.has.no; scene.append(msgBox(who, text, advance)); return; }
  if (s.gate) {
    if (S.items.includes(s.gate)) { S.needPractice = false; advance(); return; }
    // 練習の記録がないときは、章のとちゅうのまま練習場へ（合格したら、続きから再開できる）
    if (s.gate === PRACTICE_REC) { scene.append(msgBox('', s.msg, () => { S.needPractice = true; setScreen('map'); })); return; }
    scene.append(msgBox('', s.msg, quitToTown)); return;
  }
  if (s.needSign) { // 第3章：町の公園の看板を自分で確かめる
    if (S.signRead) scene.append(msgBox('あなた', '公園の入口の看板に「ドローン・ラジコンの飛行は禁止です」と書いてあった。公園では飛ばせないよ。', advance));
    else scene.append(msgBox('', '公園の看板を確かめに行こう。（町の公園の入口にある）', () => setScreen('map')));
    return;
  }
  if (s.ending) { advance(); return; }
  if (s.choice) return playChoice(s.choice);
  if (s.quiz) return playQuiz(s.quiz);
  if (s.multi) return playMulti(s.multi);
  if (s.order) return playOrder(s.order);
  if (s.dips) return playDips(s.dips);
  if (s.form) return playForm(s.form);
  if (s.show) return playShow(s.show);
  if (s.fly) return playFly(s.fly);
}

function playChoice(c) {
  scene.append(el('p', {}, c.q));
  const box = el('div', { class: 'choices' });
  for (const o of c.opts) {
    const owned = o.item && S.items.includes(o.item);
    const b = el('button', { type: 'button', onclick: () => {
      if (o.money && S.money + o.money < 0) { box.after(el('p', { class: 'small' }, 'おこづかいが足りない。')); return; }
      if (o.money) S.money += o.money;
      if (o.item) addItem(o.item);
      const dead = o.trust ? changeTrust(o.trust) : false;
      save();
      scene.innerHTML = ''; scene.append(...header(), el('p', {}, c.q));
      if (dead) return gameOver();
      if (o.ok) awardFirstTry(o.badge);
      const again = o.retry && !o.done;
      scene.append(...feedback(o.ok, o.fb, () => again ? render() : advance(), again ? (o.ok ? 'ほかも見る' : 'えらびなおす') : 'つぎへ'));
    }}, o.text);
    if (owned && o.done) { b.textContent = o.text.split('（')[0] + '（購入済み）でつづける'; b.onclick = null; b.addEventListener('click', (e) => { e.stopImmediatePropagation(); advance(); }, true); }
    else if (owned) { b.disabled = true; b.textContent = o.text + '（購入済み）'; }
    box.append(b);
  }
  scene.append(box);
}

function playQuiz(q) {
  scene.append(el('p', {}, q.q));
  const box = el('div', { class: 'choices' });
  q.opts.forEach(([t, ok]) => box.append(el('button', { type: 'button', onclick: () => {
    const dead = changeTrust(ok ? 5 : -10); save();
    scene.innerHTML = ''; scene.append(...header(), el('p', {}, q.q));
    if (dead) return gameOver();
    scene.append(...feedback(ok, ok ? q.fb : 'もう一度考えてみよう。', ok ? advance : render, ok ? 'つぎへ' : 'もう一度'));
  }}, t)));
  scene.append(box);
}

function playMulti(q) {
  const picked = new Set();
  scene.append(el('p', {}, q.q));
  const box = el('div', { class: 'choices' });
  q.opts.forEach(([t], i) => {
    const b = el('button', { type: 'button', 'aria-pressed': 'false', onclick: () => {
      picked.has(i) ? picked.delete(i) : picked.add(i);
      b.classList.toggle('picked', picked.has(i)); b.setAttribute('aria-pressed', String(picked.has(i)));
      b.textContent = (picked.has(i) ? '■ ' : '□ ') + t;
    }}, '□ ' + t);
    box.append(b);
  });
  scene.append(box, el('button', { type: 'button', class: 'primary', onclick: () => {
    const ok = q.opts.every(([, good], i) => good === picked.has(i));
    if (ok) awardFirstTry(q.badge);
    const dead = changeTrust(ok ? 5 : -10); save();
    scene.innerHTML = ''; scene.append(...header(), el('p', {}, q.q));
    if (dead) return gameOver();
    const answer = q.opts.filter(([, g]) => g).map(([t]) => '・' + t).join('\n');
    scene.append(...feedback(ok, ok ? q.fb : '選びもれか、まちがいがあるよ。もう一度考えてみよう。', ok ? advance : render, ok ? 'つぎへ' : 'もう一度'));
    if (ok) scene.querySelector('.fb').append(el('p', { class: 'small', style: 'white-space:pre-line' }, answer));
  }}, '決定'));
}

function playOrder(q) {
  const shuffled = q.items.map((t, i) => [t, i]).sort((a, b) => ((a[1] * 7 + 3) % 5) - ((b[1] * 7 + 3) % 5));
  const seq = [];
  scene.append(el('p', {}, q.q));
  const list = el('ol', { style: 'margin:0;padding-left:1.4em;min-height:1.5em' });
  const box = el('div', { class: 'choices' });
  shuffled.forEach(([t, i]) => {
    const b = el('button', { type: 'button', onclick: () => {
      seq.push(i); b.disabled = true; list.append(el('li', {}, t));
      if (seq.length === q.items.length) {
        const ok = seq.every((v, k) => v === k);
        const dead = changeTrust(ok ? 5 : -10); save();
        scene.innerHTML = ''; scene.append(...header(), el('p', {}, q.q));
        if (dead) return gameOver();
        const right = el('ol', { style: 'margin:0;padding-left:1.4em' }, ...q.items.map((t2) => el('li', {}, t2)));
        scene.append(...feedback(ok, ok ? q.fb : '順番がちがうみたい。もう一度やってみよう。', ok ? advance : render, ok ? 'つぎへ' : 'もう一度'));
        if (ok) scene.querySelector('.fb').append(right);
      }
    }}, t);
    box.append(b);
  });
  scene.append(list, box);
}

function playShow(q) {
  const picked = new Set();
  scene.append(el('p', {}, q.q));
  const box = el('div', { class: 'choices' });
  const pool = S.items.filter((x) => x !== '悩みノート');
  if (!pool.length) box.append(el('p', { class: 'small' }, '持ち物がない。'));
  pool.forEach((t) => {
    const b = el('button', { type: 'button', onclick: () => {
      picked.has(t) ? picked.delete(t) : picked.add(t);
      b.classList.toggle('picked', picked.has(t)); b.textContent = (picked.has(t) ? '■ ' : '□ ') + t;
    }}, '□ ' + t);
    box.append(b);
  });
  scene.append(box, el('button', { type: 'button', class: 'primary', onclick: () => {
    const ok = q.need.every((n) => picked.has(n));
    const dead = changeTrust(ok ? 15 : -10); save();
    scene.innerHTML = ''; scene.append(...header());
    if (dead) return gameOver();
    const missing = q.need.filter((n) => !S.items.includes(n));
    const ngText = missing.length ? `「${missing.join('」「')}」を持っていないみたい。前の章で手に入れよう。` : '見せるものが足りないみたい。登録と、ここで飛ばしてよいことがわかるものを見せよう。';
    scene.append(...feedback(ok, ok ? q.fb : ngText, ok ? advance : (missing.length ? quitToTown : render), ok ? 'つぎへ' : (missing.length ? '町の地図へ' : 'もう一度')));
  }}, '見せる'));
}

/* ---------- 起動 ---------- */
function start() { if (S.screen === 'about') S.screen = 'map'; render(); }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
</script>
